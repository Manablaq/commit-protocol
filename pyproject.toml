[project]
name = "commit-protocol-verification"
version = "0.0.1"
description = "GenLayer runtime probes for COMMIT; not a deployed custody contract"
requires-python = ">=3.12,<3.13"
dependencies = [
  "eth-hash==0.8.0",
  "genlayer-py==0.19.0rc2",
  "genlayer-test==0.30.0rc2",
  "genvm-linter==0.11.1rc2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:gltest -p no:gltest_direct"
